# Dependabot version updates for senti-mcp-server.
# Added by US-5.3 (EPIC-5), so that dependency currency stops being something a
# person has to remember to check.
#
# WHAT A GREEN DEPENDABOT PR PROVES
# =================================
#
# Every PR this bot opens runs `.github/workflows/ci.yml`, and its `verify` job
# is a required check on `main` (CONTEXT D50). Green means, on the 22.11.0
# floor and with no Senti credential: both tsconfigs typecheck, the unit suite
# passes, `tsc` emits a runnable `dist/`, and the packed tarball installs into a
# clean directory and serves the tool list its README claims.
#
# It does NOT prove three things, so they are still yours before merging:
#
#   - The live API. `test:smoke` needs a key, and CI has none, deliberately.
#   - A TRANSITIVE dependency's `engines` against the floor — see the next
#     section. npm only warns on an `engines` mismatch, so a `vite` that no
#     longer admits 22.11.0 can install, and even pass, here.
#   - Anything above the floor. CI runs one Node version.
#
# Before US-10.1 (2026-09-16) no workflow ran on a pull request here at all, and
# this header told you to run the suite locally instead. Two defects had reached
# `main` through that gap (sprint-2026-W33 §Phase 2 retrospective §Followups).
#
# THE FLOOR IS A CONSTRAINT ON DEPENDENCIES, NOT ONLY ON USERS
# ============================================================
#
# `package.json` `engines.node` is `>=22.11.0` (CONTEXT D27). Every version this
# bot proposes has to be able to run on it — LESSONS 7's cheap check,
# `npm view <pkg>@<ver> engines`, before merging rather than after.
#
# The live example, measured 2026-08-14: `vitest@4` depends on `vite` at
# `^6.0.0 || ^7.0.0 || ^8.0.0`, and **vite 7 and 8 declare
# `engines.node: ^20.19.0 || >=22.12.0` — which 22.11.0 does not satisfy**.
# Only vite 6 (`^18 || ^20 || >=22.0.0`) does. npm resolves vite 6.4.3 today, so
# the tree is fine and `npm ci` is deterministic from the lockfile — but the
# margin is one patch release wide and it is a TRANSITIVE dependency, so it will
# never appear in a PR title. When a PR touches `vitest`, check what `vite` came
# with it:
#
#     npm ls vite --all
#
# See CONTEXT D28 for the full note.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      # RULE-14: this repo's commit prefixes. Without this Dependabot writes
      # "Bump x from a to b", which is not one of them.
      prefix: chore
      include: scope

    groups:
      # One PR for the routine drift instead of one per package. Majors stay
      # ungrouped and arrive alone, because a major is a decision and deserves
      # to be reviewed as one.
      minor-and-patch:
        update-types:
          - minor
          - patch

    ignore:
      # `@types/node`'s major tracks the Node FLOOR's major, never the newest
      # release (CONTEXT D28). Types newer than the floor let `tsc` accept calls
      # to APIs the supported runtime does not have: the build stays green and
      # the failure lands on the user at run time, which is the same shape
      # CONTEXT D5 raised the floor to fix.
      #
      # This is NOT neglect, and `npm outdated` showing @types/node behind is
      # expected. Remove this entry only in the commit that raises
      # `engines.node` to the next major — the two move together.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

      # NOTE: `typescript` majors were ignored here between US-5.3 and US-5.4,
      # so that TypeScript 7 — the native compiler rewrite — could not ride into
      # `main` inside a grouped devDependency refresh. US-5.4 made that decision
      # (upgrade; CONTEXT D29) and the entry was removed with it, which is
      # exactly what its comment said to do. TypeScript now tracks normally.
      #
      # The reason it needed a decision at all still applies to the NEXT compiler
      # major: `tsc` is this repo's build, not only its typechecker, so a major
      # can change `dist/` — the published artifact. D29 records the method for
      # checking that (build both, `shasum` every `.js`), and it is cheap.
